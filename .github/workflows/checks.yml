name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      simulation_tests:
        description: Run the full test suite, including local simulation games
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Check Python syntax without running games
        run: uv run --no-sync python -m compileall -q main.py baselines experiments scripts tests third_party
      - name: Bounded Cycle 18 to 21 checks (no game engine)
        run: uv run --no-sync pytest -q tests/test_cycle18.py tests/test_majkel.py tests/test_resilience.py tests/test_calendar.py
      - name: Fresh Cycle 1 unit and recorded-history checks (no game engine)
        run: uv run --no-sync pytest -q tests/test_fresh_cycle1.py
      - name: Economic optimization and opponent scenarios (bounded, no game engine)
        run: uv run --no-sync pytest -q -rx tests/test_optimization.py
      - name: Research-led uncertainty and terminal cash scenarios (bounded, no game engine)
        run: uv run --no-sync pytest -q -rx tests/test_research_scenarios.py
      - name: User-tiered original gameplay observations (bounded, no game engine)
        run: uv run --no-sync pytest -q tests/test_tiered_gameplays.py
      - name: Full simulation tests (explicit manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.simulation_tests
        run: |
          uv sync --locked
          uv run --no-sync pytest -q
