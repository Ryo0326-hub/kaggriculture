[project]
name = "kaggriculture"
version = "0.1.0"
description = "Optimization experiments for the Kaggriculture simulation"
requires-python = ">=3.12,<3.13"
dependencies = ["kaggle-environments==1.32.7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party/kaggriculture_v36/main.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
